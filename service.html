<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>UMANGO · Service Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f2f4f8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 40px; }
    .app-wrapper { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.03); padding: 20px; }
    .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #e9edf2; background: white; cursor: pointer; transition: 0.15s; }
    .back-btn:hover { background: #f1f5f9; }
    .service-detail-icon { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 24px; font-size: 3rem; margin: 0 auto 16px; }
    .detail-card { background: #f8fafc; border-radius: 24px; border: 1px solid #e9edf2; padding: 24px; }
    .detail-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e9edf2; }
    .detail-item:last-child { border-bottom: none; }
    .detail-label { color: #64748b; font-weight: 500; }
    .detail-value { color: #0b1e3a; font-weight: 600; text-align: right; }
    .bg-soft-primary { background: #e9f0ff; }
    .bg-soft-success { background: #e4f5ec; }
    .bg-soft-warning { background: #fff4e0; }
    .bg-soft-danger { background: #ffe9e9; }
    .bg-soft-purple { background: #efe6ff; }
    .bg-soft-teal { background: #ddf3f0; }
    .bg-soft-pink { background: #ffe6f0; }
    .bg-soft-orange { background: #ffedd5; }
    .doc-list { list-style: none; padding: 0; margin: 0; }
    .doc-list li { padding: 6px 0; display: flex; align-items: center; gap: 8px; }
    .doc-list li::before { content: "•"; color: #0d6efd; font-weight: bold; font-size: 1.2rem; }
  </style>
</head>
<body>
<main class="app-wrapper">
  <!-- BACK BUTTON -->
  <nav class="d-flex align-items-center gap-3 mb-4">
    <div class="back-btn" onclick="goBack()" role="button" aria-label="Go back">
      <i class="bi bi-arrow-left fs-5" aria-hidden="true"></i>
    </div>
    <span class="fw-bold fs-5" id="serviceTitle">Service Details</span>
  </nav>

  <!-- SERVICE DETAILS -->
  <article id="serviceDetailContainer">
    <div class="text-center mb-4">
      <div class="service-detail-icon" id="serviceIcon"><i class="bi bi-file-earmark" aria-hidden="true"></i></div>
      <h1 class="fw-bold fs-4" id="serviceName">Loading...</h1>
      <p class="text-muted" id="serviceCategory">Category</p>
    </div>

    <div class="detail-card" id="detailsCard">
      <div id="detailsContent">
        <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Loading service details...</p>
        </div>
      </div>
    </div>
  </article>
</main>

<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const serviceName = params.get('service') || 'all';
    const titleEl = document.getElementById('serviceTitle');
    const nameEl = document.getElementById('serviceName');
    const iconEl = document.getElementById('serviceIcon');
    const categoryEl = document.getElementById('serviceCategory');
    const detailsContent = document.getElementById('detailsContent');

    titleEl.textContent = serviceName === 'all' ? 'All Services' : serviceName;
    nameEl.textContent = serviceName === 'all' ? 'All Services' : serviceName;

    // Load service details from service_details.json
    fetch('data/service_details.json')
      .then(res => { if (!res.ok) throw new Error('Failed to load service details'); return res.json(); })
      .then(data => {
        if (serviceName === 'all') {
          detailsContent.innerHTML = `
            <div class="text-center py-4">
              <i class="bi bi-grid-3x3-gap-fill fs-1 text-primary" aria-hidden="true"></i>
              <h5 class="mt-3">All Services</h5>
              <p class="text-muted">Browse all available services from the main page.</p>
              <a href="index.html" class="btn btn-primary mt-2">Go to Home</a>
            </div>
          `;
          iconEl.className = 'service-detail-icon bg-soft-primary';
          iconEl.innerHTML = '<i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>';
          categoryEl.textContent = 'Overview';
          return;
        }

        // Find service details
        const serviceDetail = data[serviceName];
        if (!serviceDetail) {
          detailsContent.innerHTML = `
            <div class="text-center py-4">
              <i class="bi bi-exclamation-triangle fs-1 text-warning" aria-hidden="true"></i>
              <h5 class="mt-3">Service Not Found</h5>
              <p class="text-muted">No details available for "${serviceName}".</p>
              <a href="index.html" class="btn btn-primary mt-2">Go to Home</a>
            </div>
          `;
          iconEl.className = 'service-detail-icon bg-soft-warning';
          iconEl.innerHTML = '<i class="bi bi-question-circle" aria-hidden="true"></i>';
          categoryEl.textContent = 'Not Found';
          return;
        }

        // Render service details
        const { icon, bg, category, fees, lastDate, requiredDocuments, description, processingTime } = serviceDetail;
        
        // Set icon
        iconEl.className = `service-detail-icon ${bg || 'bg-soft-primary'}`;
        iconEl.innerHTML = `<i class="bi ${icon || 'bi-file-earmark'}" aria-hidden="true"></i>`;
        categoryEl.textContent = category || 'Service';
        nameEl.textContent = serviceName;

        // Build details HTML
        let detailsHTML = `
          <div class="mb-3">
            <p class="text-muted">${description || 'No description available.'}</p>
          </div>
        `;

        // Fees
        if (fees) {
          detailsHTML += `
            <div class="detail-item">
              <span class="detail-label"><i class="bi bi-currency-rupee" aria-hidden="true"></i> Fees</span>
              <span class="detail-value">${fees}</span>
            </div>
          `;
        }

        // Last Date
        if (lastDate) {
          detailsHTML += `
            <div class="detail-item">
              <span class="detail-label"><i class="bi bi-calendar-event" aria-hidden="true"></i> Last Date</span>
              <span class="detail-value">${lastDate}</span>
            </div>
          `;
        }

        // Processing Time
        if (processingTime) {
          detailsHTML += `
            <div class="detail-item">
              <span class="detail-label"><i class="bi bi-clock" aria-hidden="true"></i> Processing Time</span>
              <span class="detail-value">${processingTime}</span>
            </div>
          `;
        }

        // Required Documents
        if (requiredDocuments && requiredDocuments.length > 0) {
          detailsHTML += `
            <div class="detail-item" style="flex-direction:column; align-items:stretch; gap:8px;">
              <span class="detail-label"><i class="bi bi-file-earmark-text" aria-hidden="true"></i> Required Documents</span>
              <ul class="doc-list">
                ${requiredDocuments.map(doc => `<li>${doc}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        detailsContent.innerHTML = detailsHTML;
      })
      .catch(err => {
        console.error('Error loading service_details.json:', err);
        detailsContent.innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-exclamation-triangle fs-1 text-danger" aria-hidden="true"></i>
            <h5 class="mt-3">Error Loading Details</h5>
            <p class="text-muted">Unable to load service details. Please try again.</p>
            <a href="index.html" class="btn btn-primary mt-2">Go to Home</a>
          </div>
        `;
        iconEl.className = 'service-detail-icon bg-soft-danger';
        iconEl.innerHTML = '<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>';
      });

    window.goBack = function() {
      window.location.href = 'index.html';
    };
  })();
</script>
</body>
</html>
