<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>UMANGO · Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f2f4f8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .app-wrapper { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.03); padding: 20px; }
    .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #e9edf2; background: white; cursor: pointer; transition: 0.15s; }
    .back-btn:hover { background: #f1f5f9; }
    .service-detail-icon { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 24px; font-size: 3rem; margin: 0 auto 16px; }
    .bg-soft-primary { background: #e9f0ff; }
    .bg-soft-success { background: #e4f5ec; }
    .bg-soft-warning { background: #fff4e0; }
    .bg-soft-danger { background: #ffe9e9; }
    .bg-soft-purple { background: #efe6ff; }
    .bg-soft-teal { background: #ddf3f0; }
    .bg-soft-pink { background: #ffe6f0; }
    .bg-soft-orange { background: #ffedd5; }
  </style>
</head>
<body>
<main class="app-wrapper">
  <nav class="d-flex align-items-center gap-3 mb-4">
    <div class="back-btn" onclick="goBack()" role="button" aria-label="Go back">
      <i class="bi bi-arrow-left fs-5" aria-hidden="true"></i>
    </div>
    <span class="fw-bold fs-5" id="serviceTitle">Service</span>
  </nav>

  <article class="text-center p-4" style="background:#f8fafc; border-radius:24px; border:1px solid #e9edf2;">
    <div class="service-detail-icon" id="serviceIcon"><i class="bi bi-file-earmark" aria-hidden="true"></i></div>
    <h1 class="fw-bold fs-4" id="serviceName">Service Name</h1>
    <p class="text-muted" id="serviceDesc">Loading service details...</p>
    <div class="mt-3 p-3 bg-white rounded-4 border">
      <small class="text-muted">Service: <span class="fw-semibold text-dark" id="serviceParam">—</span></small>
    </div>
  </article>
</main>

<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const serviceName = params.get('service') || 'all';
    const titleEl = document.getElementById('serviceTitle');
    const nameEl = document.getElementById('serviceName');
    const iconEl = document.getElementById('serviceIcon');
    const descEl = document.getElementById('serviceDesc');
    const paramEl = document.getElementById('serviceParam');

    titleEl.textContent = serviceName === 'all' ? 'All Services' : serviceName;
    nameEl.textContent = serviceName === 'all' ? 'All Services' : serviceName;
    paramEl.textContent = serviceName;

    fetch('data/data.json')
      .then(res => { if (!res.ok) throw new Error('Network error'); return res.json(); })
      .then(data => {
        if (serviceName === 'all') {
          descEl.textContent = 'Showing all available services.';
          iconEl.innerHTML = '<i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>';
          iconEl.className = 'service-detail-icon bg-soft-primary';
          return;
        }
        let found = null;
        if (data.categories) {
          for (const cat of data.categories) {
            const svc = cat.services.find(s => s.name === serviceName);
            if (svc) { found = { ...svc, category: cat.name }; break; }
          }
        }
        if (found) {
          iconEl.innerHTML = `<i class="bi ${found.icon || 'bi-file-earmark'}" aria-hidden="true"></i>`;
          iconEl.className = `service-detail-icon ${found.bg || 'bg-soft-primary'}`;
          descEl.textContent = `This service is part of "${found.category}".`;
        } else {
          descEl.textContent = `Service "${serviceName}" not found.`;
          iconEl.innerHTML = '<i class="bi bi-question-circle" aria-hidden="true"></i>';
          iconEl.className = 'service-detail-icon bg-soft-warning';
        }
      })
      .catch(() => {
        descEl.textContent = 'Unable to load service details. Please try again.';
        iconEl.innerHTML = '<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>';
        iconEl.className = 'service-detail-icon bg-soft-warning';
      });

    window.goBack = function() {
      window.location.href = 'index.html';
    };
  })();
</script>
</body>
</html>
